<!doctype html>
<!-- No data-theme here on purpose. src/lib/theme.js sets it on import, from
     what was saved or from the operating system preference. Hardcoding light
     here would briefly override a dark preference on every load. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />

    <!-- Inter, variable on the weight axis (400..700) so the in-between
         weights (450 body, 500 buttons, 550 names) render exactly. Only the
         weight axis is requested, so Google serves Inter's text cuts, never
         the Inter Display optical sizes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <title>LeadPlus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
